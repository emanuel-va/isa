<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>ISA</title>
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="styles/fonts.css">
        <link rel="icon" href="assets/img/logos/icon.png" type="image/png">
    </head>
    <body class="light">
        <header>
            <img id="logo" src="assets/img/logos/light.png">
            <h1>ISA Calculator</h1>
            <button id="switch-theme-button">
                <img id="theme-icon" src="assets/img/icons/dark.png">
            </button>
        </header>
        <main>
            <section class="section input">
                <h2>Input</h2>
                <div class="box box__item">
                    <label for="input">Z</label>
                    <input id="input" type="number" placeholder="0">
                    <span>m</span>
                </div>
                <span class="message"></span>
                <button id="calculate-button">Calculate</button>
            </section>
            <section class="section output">
                <h2>Output</h2>
                <div class="box">
                    <div class="box__item">
                        <span>g</span>
                        <input type="text" name="gravity" placeholder="-" readonly>
                        <span>m/s<sup>2</sup></span>
                    </div>
                    <div class="box__item">
                        <span>T<sub>M</sub></span>
                        <input type="text" name="temperature" placeholder="-" readonly>
                        <span>K</span>
                    </div>
                    <div class="box__item">
                        <span>P</span>
                        <input type="text" name="pressure" placeholder="-" readonly>
                        <span>Pa</span>
                    </div>
                    <div class="box__item">
                        <span>&rho;</span>
                        <input type="text" name="density" placeholder="-" readonly>
                        <span>kg/m<sup>3</sup></span>
                    </div>
                    <div class="box__item">
                        <span>C<sub>s</sub></span>
                        <input type="text" name="speed-of-sound" placeholder="-" readonly>
                        <span>m/s</span>
                    </div>
                    <div class="box__item">
                        <span>&mu;</span>
                        <input type="text" name="viscosity" placeholder="-" readonly>
                        <span>Pa&centerdot;s</span>
                    </div>
                </div>
            </section>
            <footer class="section">
                <div class="github">
                    <img src="assets/img/icons/github.png">
                    <span><a href="https://github.com/emanuel-va/isa" target="_blank">GitHub</a></span>
                </div>
                <span>Copyright &copy; 2026</span>
            </footer>
        </main>
        <script type='module' src="scripts/main.js"></script>
    </body>
</html>
